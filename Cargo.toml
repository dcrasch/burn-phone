[package]
name = "burn-phone"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"

[lib]
name = "burn_phone"
crate-type = ["cdylib", "rlib"]

[dependencies]
eframe = { version = "0.37", default-features = false, features = [
  "default_fonts",
  "glow",
] }
log = "0.4"
burn = { version = "0.21", default-features = false, features = [
  "std",
  "flex",
] }
burn-flex = "0.21"
burn-store = { version = "0.21", default-features = false, features = [
  "std",
  "burnpack",
] }
# The `support-hexagon` branch carries the fused QNN graph API used by
# `src/squeezenet_fused.rs` (the default branch does not).
burn-npu = { git = "https://github.com/dcrasch/burn-npu/", branch = "support-hexagon", features = [
  "qualcomm",
] }
libloading = "0.9"
image = { version = "0.25", default-features = false, features = ["jpeg"] }

[build-dependencies]
burn-onnx = "0.21"

[target.'cfg(target_os = "android")'.dependencies]
winit = { version = "0.30", default-features = false, features = [
  "android-native-activity",
] }
android_logger = "0.15"
ndk-sys = "0.6"
ndk-context = "0.1"
jni = "0.22"

[[package.metadata.android.uses_permission]]
name = "android.permission.CAMERA"

# Optimize dependencies even in debug builds, otherwise debug egui is very slow.
[profile.dev.package."*"]
opt-level = 2

# The app's own hot loops (image preprocessing, layout conversion) also need
# optimization; unoptimized debug code made preprocessing dominate inference.
[profile.dev.package.burn-phone]
opt-level = 2

[profile.release]
strip = "symbols"

# ---------------------------------------------------------------------------
# Android packaging (cargo-apk)
# ---------------------------------------------------------------------------

[package.metadata.android]
package = "dev.burnphone.app"
apk_name = "burn-phone"
build_targets = ["aarch64-linux-android", "x86_64-linux-android"]
strip = "strip"
# Populated by `just qnn-libs` from the QNN SDK. Only arm64-v8a contains
# libraries; x86_64 stays empty so the emulator build still succeeds and
# simply runs the CPU fallback path.
runtime_libs = "qnn-libs"
# Launcher icons generated from `icons/icon.svg`.
resources = "res"

[package.metadata.android.sdk]
min_sdk_version = 28
target_sdk_version = 30

[package.metadata.android.application]
label = "Burn Phone"
icon = "@mipmap/ic_launcher"
theme = "@android:style/Theme.DeviceDefault.NoActionBar.Fullscreen"
# The DSP loader reads libQnnHtpV*Skel.so from a real directory, so native
# libraries must be extracted from the APK rather than mapped in place.
extract_native_libs = true

[package.metadata.android.application.activity]
config_changes = "orientation|keyboardHidden|screenSize|screenLayout|smallestScreenSize|uiMode|density"
orientation = "unspecified"
